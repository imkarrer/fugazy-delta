schema-version = "1.16.0"

[install]
python312.pkg-path = "python312"
uv.pkg-path = "uv"
ffmpeg.pkg-path = "ffmpeg"
dejavu_fonts.pkg-path = "dejavu_fonts"

[vars]
PROTOTYPE_PORT = "8642"

[hook]
on-activate = '''
  export UV_CACHE_DIR="$FLOX_ENV_CACHE/uv-cache"
  export UV_PROJECT_ENVIRONMENT="$FLOX_ENV_CACHE/venv"
  venv="$UV_PROJECT_ENVIRONMENT"
  stamp="$FLOX_ENV_CACHE/.deps-$(cat "$FLOX_ENV_PROJECT/pyproject.toml" "$FLOX_ENV_PROJECT/uv.lock" 2>/dev/null | shasum | cut -c1-12)"
  if [ ! -f "$stamp" ]; then
    (cd "$FLOX_ENV_PROJECT" && uv sync --quiet --python "$(command -v python3)") && rm -f "$FLOX_ENV_CACHE"/.deps-* && touch "$stamp"
  fi
  # `flox activate -- cmd` runs no profile script, so put the venv on PATH
  # here for it; interactive shells get the venv from [profile] below.
  export PATH="$venv/bin:$PATH"
'''

# Activate the venv in the user's shell. Activating it in the hook is undone
# when Flox sets PATH, which leaves `python` without the project's packages.
[profile]
bash = '''
  source "$FLOX_ENV_CACHE/venv/bin/activate"
'''
zsh = '''
  source "$FLOX_ENV_CACHE/venv/bin/activate"
'''
fish = '''
  source "$FLOX_ENV_CACHE/venv/bin/activate.fish"
'''

# The clickable prototype. `flox activate --start-services` serves it at
# http://localhost:$PROTOTYPE_PORT
[services.prototype]
command = 'python3 -m http.server "$PROTOTYPE_PORT" --bind 127.0.0.1 --directory "$FLOX_ENV_PROJECT/prototype"'

[options]
systems = ["aarch64-darwin", "x86_64-darwin", "aarch64-linux", "x86_64-linux"]
