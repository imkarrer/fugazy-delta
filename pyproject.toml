[project]
name = "fugazy-delta"
version = "0.0.1"
description = "Autocross and track-day telemetry: RaceBox + GoPro → runs, deltas, optimal lap, overlay video"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2",
  # time zone at a position, for files that record local time only
  "tzfpy>=1.0",
  "tzdata",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fugazy_delta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "fixtures: needs downloaded real-device sample files (scripts/fetch-fixtures.sh)",
  "ffmpeg: needs ffmpeg on PATH",
]
